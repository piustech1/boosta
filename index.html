<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ADDFF1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Boosta — Premium Social Growth Engine</title>

  <!-- Google Fonts: Inter for iOS system UI + Syne for twisted, high-end display typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:ital,wght@0,700;0,800;1,800&family=Plus+Jakarta+Sans:ital,wght@0,700;1,800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Ambient Liquid Background with glowing animated orbs -->
  <div class="liquid-canvas" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
  </div>

  <!-- Main Mobile App Shell -->
  <main class="app-container">
    
    <!-- Floating Top App Bar (Detached, Floating Pill with Twisted Font & Relative Action Icons) -->
    <header class="floating-appbar-wrapper">
      <nav class="floating-appbar glass-pill">
        <!-- Site Brand with Twisted Avant-Garde Typography -->
        <div class="brand-left">
          <div class="brand-spark-dot" aria-hidden="true"></div>
          <span class="twisted-brand">boosta<span class="brand-dot">.</span></span>
        </div>

        <!-- Relative Action Icons on the Right -->
        <div class="appbar-actions">
          <!-- Live Engine Speed Badge -->
          <div class="status-chip glass-pill">
            <span class="status-pulse-dot"></span>
            <span class="status-text">99.9%</span>
          </div>

          <!-- Notification / Live Updates Bell -->
          <button class="icon-bubble glass-pill" aria-label="Notifications">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
              <path d="M13.73 21a2 2 0 0 1-3.46 0" />
            </svg>
            <span class="unread-dot" aria-hidden="true"></span>
          </button>

          <!-- Quick Menu / Sparkle Icon -->
          <button class="icon-bubble glass-pill" aria-label="Menu">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="1.5" />
              <circle cx="19" cy="12" r="1.5" />
              <circle cx="5" cy="12" r="1.5" />
            </svg>
          </button>
        </div>
      </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero-section">
      <!-- Classy Floating TikTok SMM Metric Badges -->
      <div class="floating-chip chip-tiktok-views glass-pill">
        <div class="chip-badge-icon tiktok-glow">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
            <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64c.3-.002.6.042.88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 3 15.68 6.34 6.34 0 0 0 9.33 22a6.34 6.34 0 0 0 6.34-6.32V8.75a8.28 8.28 0 0 0 4.84 1.56V6.87c-.31-.03-.62-.09-.92-.18z"/>
          </svg>
        </div>
        <div class="chip-text-group">
          <span class="chip-label">TikTok Views</span>
          <span class="chip-metric">1.2M <span class="trend-up">↑</span></span>
        </div>
      </div>

      <div class="floating-chip chip-tiktok-likes glass-pill">
        <div class="chip-badge-icon like-glow">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="#FE2C55">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </div>
        <div class="chip-text-group">
          <span class="chip-label">TikTok Likes</span>
          <span class="chip-metric">+84.6K</span>
        </div>
      </div>

      <div class="floating-chip chip-tiktok-followers glass-pill">
        <div class="chip-badge-icon followers-glow">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="8.5" cy="7" r="4" />
            <line x1="20" y1="8" x2="20" y2="14" />
            <line x1="23" y1="11" x2="17" y2="11" />
          </svg>
        </div>
        <div class="chip-text-group">
          <span class="chip-label">TikTok Followers</span>
          <span class="chip-metric">+25.4K</span>
        </div>
      </div>

      <!-- Prominent Hero Asset in an Irregular Morphing Liquid Dudu Pebble -->
      <div class="hero-asset-card irregular-dudu" id="heroAssetCard">
        <!-- Ambient Liquid Halo & Specular Refraction -->
        <div class="character-halo" aria-hidden="true"></div>
        <div class="liquid-rim-glow" aria-hidden="true"></div>

        <div class="character-wrapper">
          <!-- Fallback SVG shown only if assets are missing -->
          <div class="character-fallback" id="characterFallback">
            <svg viewBox="0 0 240 280" class="fallback-svg" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="charGrad" x1="20" y1="20" x2="220" y2="260" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#ADDFF1" />
                  <stop offset="1" stop-color="#003152" />
                </linearGradient>
                <linearGradient id="skinGrad" x1="80" y1="60" x2="160" y2="160" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#FFE0BD" />
                  <stop offset="1" stop-color="#F3C397" />
                </linearGradient>
              </defs>
              <circle cx="120" cy="140" r="100" fill="#ADDFF1" fill-opacity="0.35" />
              <path d="M60 270 C60 190, 85 170, 120 170 C155 170, 180 190, 180 270 Z" fill="url(#charGrad)" />
              <rect x="108" y="145" width="24" height="30" rx="12" fill="url(#skinGrad)" />
              <ellipse cx="120" cy="115" rx="36" ry="42" fill="url(#skinGrad)" />
              <path d="M84 110 C84 75, 110 65, 126 65 C146 65, 158 80, 156 102 C148 95, 138 92, 120 95 C102 98, 92 104, 84 110 Z" fill="#003152" />
              <circle cx="107" cy="112" r="3" fill="#003152" />
              <circle cx="133" cy="112" r="3" fill="#003152" />
              <path d="M112 126 Q120 134 128 126" stroke="#003152" stroke-width="2.5" stroke-linecap="round" fill="none" />
              <g class="waving-arm-animation">
                <path d="M165 185 C185 160, 195 130, 198 100" stroke="url(#charGrad)" stroke-width="16" stroke-linecap="round" fill="none" />
                <circle cx="200" cy="92" r="12" fill="url(#skinGrad)" />
                <path d="M216 80 Q222 92 216 104" stroke="#003152" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
                <path d="M222 75 Q230 92 222 109" stroke="#ADDFF1" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" />
              </g>
            </svg>
          </div>

          <!-- Prominent Mickey Asset with High-End Outline Blend -->
          <img 
            src="assets/mickey.png" 
            alt="Mickey Waving" 
            id="heroImage" 
            class="hero-img cutout-asset"
            loading="eager"
            onerror="if(this.src.indexOf('.png')!==-1){this.src='assets/mickey.jpg';}else{this.style.display='none';document.getElementById('characterFallback').style.display='flex';}"
            onload="this.style.display='block'; document.getElementById('characterFallback').style.display='none';"
          />
        </div>
      </div>

      <!-- Animated Chat Bubble directly emerging from Mickey's waving hand -->
      <div class="chat-bubble-container" id="chatBubble">
        <div class="glass-bubble chat-bubble">
          <!-- Chat bubble pointer/tail pointing directly towards Mickey's waving gesture -->
          <div class="chat-tail"></div>
          
          <div class="chat-content">
            <div class="chat-meta">
              <span class="chat-sender">BOOSTA ASSIST</span>
              <span class="chat-time">Just now</span>
            </div>
            <p class="chat-message">
              Hey! Welcome to your new growth engine. Let's get started.
            </p>
            <div class="chat-read-status">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 9l3 3L14 3" />
                <path d="M6 9l3 3L15 4" opacity="0.7" />
              </svg>
            </div>
          </div>
        </div>
      </div>

      <!-- Supported Services Dock (Instagram, TikTok, Telegram, YouTube, X) -->
      <div class="supported-services-section">
        <div class="services-label-wrapper">
          <span class="services-label-line"></span>
          <span class="services-label-text">SUPPORTED PLATFORMS</span>
          <span class="services-label-line"></span>
        </div>

        <div class="services-dock glass-pill">
          <!-- Instagram -->
          <div class="service-pill" title="Instagram Growth">
            <div class="service-icon-box ig-box">
              <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
              </svg>
            </div>
            <span class="service-name">Instagram</span>
          </div>

          <!-- TikTok -->
          <div class="service-pill" title="TikTok Growth">
            <div class="service-icon-box tt-box">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64c.3-.002.6.042.88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 3 15.68 6.34 6.34 0 0 0 9.33 22a6.34 6.34 0 0 0 6.34-6.32V8.75a8.28 8.28 0 0 0 4.84 1.56V6.87c-.31-.03-.62-.09-.92-.18z"/>
              </svg>
            </div>
            <span class="service-name">TikTok</span>
          </div>

          <!-- Telegram -->
          <div class="service-pill" title="Telegram Growth">
            <div class="service-icon-box tg-box">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.5 3.5L2 11l7 3 3 7 3.5-5.5L20 18l1.5-14.5z"/>
                <path d="M9 14l5-4"/>
              </svg>
            </div>
            <span class="service-name">Telegram</span>
          </div>

          <!-- YouTube -->
          <div class="service-pill" title="YouTube Growth">
            <div class="service-icon-box yt-box">
              <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor">
                <path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19.1c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.43z"/>
                <polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02" fill="#FFFFFF"/>
              </svg>
            </div>
            <span class="service-name">YouTube</span>
          </div>

          <!-- X (Twitter) -->
          <div class="service-pill" title="X Growth">
            <div class="service-icon-box x-box">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
              </svg>
            </div>
            <span class="service-name">X</span>
          </div>
        </div>
      </div>

    </section>

    <!-- Bottom Controls: Sleek Minimalist "Half-Bars" -->
    <footer class="controls-container">
      <div class="half-bars-wrapper">
        <!-- Button 1: Primary "Get Started" (Glassy Dark Azure #003152, White Text) -->
        <button class="half-bar-btn primary-btn" id="btnGetStarted" aria-label="Get Started">
          <span class="btn-sheen" aria-hidden="true"></span>
          <span class="btn-text">Get Started</span>
          <span class="btn-icon">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 10h12" />
              <path d="M11 5l5 5-5 5" />
            </svg>
          </span>
        </button>

        <!-- Button 2: Secondary "Log In" (Transparent Glass Bubble, Dark Azure Text) -->
        <button class="half-bar-btn secondary-btn" id="btnLogIn" aria-label="Log In">
          <span class="btn-text">Log In</span>
          <span class="btn-icon">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3H6a2 2 0 00-2 2v10a2 2 0 002 2h6" />
              <path d="M16 10l-4-4m4 4l-4 4m4-4H8" />
            </svg>
          </span>
        </button>
      </div>

      <!-- iOS Native Style Home Indicator Bar -->
      <div class="ios-home-indicator" aria-hidden="true"></div>
    </footer>

  </main>

  <script src="app.js"></script>
</body>
</html>
